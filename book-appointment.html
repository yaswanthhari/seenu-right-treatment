<!-- Add this modal to your existing HTML -->
<div id="appointmentModal" class="modal">
    <div class="modal-content" style="max-width: 600px;">
        <h2>Book Hospital Appointment</h2>
        <form id="appointmentForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" title="Full Name" required>
                </div>
                <div class="form-group">
                    <label for="phoneNumber">Phone Number *</label>
                    <input type="tel" id="phoneNumber" placeholder="Enter your phone number" title="Phone Number" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="hospitalSelect">Select Hospital *</label>
                <select id="hospitalSelect" title="Select a hospital" required>
                    <option value="">Choose hospital</option>
                    <!-- Options loaded from API -->
                </select>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label for="preferredDate">Preferred Date *</label>
                    <input type="date" id="preferredDate" title="Preferred Date" required>
                </div>
                <div class="form-group">
                    <label for="timeSlot">Time Slot *</label>
                    <select id="timeSlot" title="Select a time slot" required>
                        <option value="">Select time</option>
                        <option value="9:00 AM">9:00 AM</option>
                        <option value="10:00 AM">10:00 AM</option>
                        <option value="11:00 AM">11:00 AM</option>
                        <option value="2:00 PM">2:00 PM</option>
                        <option value="3:00 PM">3:00 PM</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label for="symptoms">Symptoms / Reason for Visit *</label>
                <textarea id="symptoms" rows="3" placeholder="Describe your symptoms or reason for visit" title="Symptoms" required></textarea>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">
                    <i class="fas fa-calendar-check"></i> Book Appointment
                </button>
                <button type="button" class="btn btn-secondary" onclick="closeAppointmentModal()" style="flex: 1;">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Load hospitals for dropdown
    async function loadHospitals() {
        try {
            const response = await fetch('/api/hospitals');
            const hospitals = await response.json();
            
            const select = document.getElementById('hospitalSelect');
            select.innerHTML = '<option value="">Choose hospital</option>';
            
            hospitals.forEach(hospital => {
                const option = document.createElement('option');
                option.value = hospital._id;
                option.textContent = `${hospital.name} (${hospital.city})`;
                select.appendChild(option);
            });
        } catch (error) {
            console.error('Error loading hospitals:', error);
        }
    }

    // Open appointment modal
    function openAppointmentModal() {
        document.getElementById('appointmentModal').style.display = 'flex';
        loadHospitals();
    }

    function closeAppointmentModal() {
        document.getElementById('appointmentModal').style.display = 'none';
    }

    // Handle appointment booking
    document.getElementById('appointmentForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = {
            patientName: this.querySelector('input[type="text"]').value,
            phone: this.querySelector('input[type="tel"]').value,
            hospitalId: this.querySelector('#hospitalSelect').value,
            date: this.querySelector('input[type="date"]').value,
            time: this.querySelector('select').value,
            symptoms: this.querySelector('textarea').value
        };

        try {
            const response = await fetch('/api/appointments', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            });

            if (response.ok) {
                alert('Appointment requested successfully! Our team will contact you shortly.');
                closeAppointmentModal();
            } else {
                alert('Error booking appointment');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Network error. Please try again.');
        }
    });
</script>
